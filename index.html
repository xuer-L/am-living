<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>am-living</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background: #0a0e0d;
    color: #c8d0cc;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .container { max-width: 520px; width: 100%; }

  /* ── Header ── */
  .header { display: flex; align-items: center; gap: 18px; margin-bottom: 36px; }
  .avatar { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #2a4a3a; flex-shrink: 0; background: #1a2a22; }
  .header-info h1 { font-size: 22px; font-weight: 500; color: #e0e8e3; letter-spacing: 0.5px; }
  .header-info .handle { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5a7a6a; margin-top: 2px; }
  .status-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; animation: pulse 2s ease-in-out infinite; }
  .status-dot.online { background: #4caf7a; box-shadow: 0 0 6px #4caf7a88; }
  .status-dot.idle { background: #c4a84a; box-shadow: 0 0 6px #c4a84a88; }
  .status-dot.offline { background: #6a4a4a; box-shadow: none; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ── Agent Cards ── */
  .agents-row { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
  .agent-card { flex: 1; background: #111a16; border: 1px solid #1e3028; border-radius: 10px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .agent-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1px solid #2a4a3a; flex-shrink: 0; }
  .agent-name { font-size: 14px; color: #d0e0d6; font-weight: 500; }
  .agent-status { font-size: 11px; color: #5a7a6a; margin-top: 2px; font-family: 'JetBrains Mono', monospace; }

  /* ── Current Status ── */
  .current { background: #111a16; border: 1px solid #1e3028; border-radius: 12px; padding: 20px 22px; margin-bottom: 24px; }
  .current .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #5a7a6a; margin-bottom: 10px; }
  .current .activity { font-size: 16px; color: #d0e0d6; line-height: 1.5; }
  .current .time { font-size: 12px; color: #4a6a5a; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

  /* ── Tasks ── */
  .tasks-section { margin-bottom: 24px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #5a7a6a; margin-bottom: 14px; }
  .task-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .task-dot { width: 6px; height: 6px; border-radius: 50%; background: #3a5a4a; flex-shrink: 0; }
  .task-dot.today { background: #4caf7a; }
  .task-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3a5a4a; min-width: 100px; }
  .task-content { font-size: 13px; color: #a0b8aa; }
  .empty-hint { font-size: 13px; color: #3a4a40; font-style: italic; }

  /* ── Comment ── */
  .comment { background: #0f1714; border-left: 3px solid #3a6a50; border-radius: 0 10px 10px 0; padding: 16px 20px; margin-bottom: 28px; display: flex; gap: 14px; align-items: flex-start; }
  .comment-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex-shrink: 0; border: 1px solid #2a4a3a; }
  .comment-body { flex: 1; }
  .comment .quote { font-size: 14px; color: #8ab09a; font-style: italic; line-height: 1.6; }
  .comment .author { font-size: 12px; color: #4a6a5a; margin-top: 8px; }

  /* ── History ── */
  .history-item { display: flex; gap: 14px; padding: 12px 0; border-bottom: 1px solid #141e1a; }
  .history-item:last-child { border-bottom: none; }
  .history-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #3a5a4a; min-width: 52px; padding-top: 2px; flex-shrink: 0; }
  .history-text { font-size: 14px; color: #a0b8aa; line-height: 1.5; }

  /* ── Footer ── */
  .footer { margin-top: 32px; text-align: center; font-size: 11px; color: #2a3a30; font-family: 'JetBrains Mono', monospace; }

  @media (max-width: 560px) { body { padding: 24px 16px; } .avatar { width: 64px; height: 64px; } .header-info h1 { font-size: 19px; } }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <img class="avatar" src="avatar.jpg" alt="avatar">
    <div class="header-info">
      <h1 id="display-name">loading...</h1>
      <div class="handle" id="display-handle"></div>
      <div class="status-badge">
        <span class="status-dot online" id="user-dot"></span>
        <span id="user-status-text">loading...</span>
      </div>
    </div>
  </div>

  <!-- Agents (由 JS 动态生成，config.env 中无 AGENT_ 配置则隐藏) -->
  <div class="agents-row" id="agents-row" style="display:none;"></div>

  <!-- Current Activity -->
  <div class="current">
    <div class="label">当前状态</div>
    <div class="activity" id="current-activity">loading...</div>
    <div class="time" id="current-time"></div>
  </div>

  <!-- Tasks -->
  <div class="tasks-section">
    <div class="section-title">待办任务</div>
    <div id="tasks-list"></div>
  </div>

  <!-- Comment -->
  <div class="comment" id="comment-section" style="display:none;">
    <div class="comment-body">
      <div class="quote" id="comment-text"></div>
      <div class="author" id="comment-author"></div>
    </div>
  </div>

  <!-- History -->
  <div class="section-title">最近动态</div>
  <div id="history-list"></div>

  <!-- Footer -->
  <div class="footer" id="footer-text">powered by status-page</div>

</div>

<script>
async function loadStatus() {
  try {
    const resp = await fetch('data/status.json?' + Date.now());
    if (!resp.ok) throw new Error('fetch failed');
    const d = await resp.json();

    // 配置信息（来自 status.json 的 config 字段）
    const cfg = d.config || {};

    // 显示名称
    if (cfg.display_name) document.getElementById('display-name').textContent = cfg.display_name;
    if (cfg.display_handle) document.getElementById('display-handle').textContent = cfg.display_handle;
    if (cfg.title) document.title = cfg.title;
    if (cfg.footer) document.getElementById('footer-text').textContent = cfg.footer;

    // 更新时间
    document.getElementById('current-time').textContent = '最后更新 ' + d.updated;
    document.getElementById('current-activity').textContent = d.user?.activity || '—';

    // 用户在线状态
    const userText = document.getElementById('user-status-text');
    const userDot = document.getElementById('user-dot');
    if (d.user?.activity && d.user.activity !== 'idle') {
      userText.textContent = d.user.activity;
      userDot.className = 'status-dot online';
    } else {
      userText.textContent = 'idle';
      userDot.className = 'status-dot idle';
    }

    // Agent 卡片（支持数组和对象格式）
    const agentsRaw = d.agents || [];
    const agentsArr = Array.isArray(agentsRaw) ? agentsRaw : Object.values(agentsRaw);
    const agentsRow = document.getElementById('agents-row');
    if (agentsArr.length > 0) {
      agentsRow.style.display = 'flex';
      agentsRow.innerHTML = agentsArr.map(a => {
        const avatar = a.avatar ? `<img class="agent-avatar" src="${a.avatar}" alt="${a.name}">` :
          `<div style="width:36px;height:36px;border-radius:50%;background:#1a2a22;border:1px solid #2a4a3a;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;">🤖</div>`;
        return `<div class="agent-card">
          ${avatar}
          <div>
            <div class="agent-name">${a.name || 'Agent'}</div>
            <div class="agent-status">${a.status || 'offline'}${a.last_seen ? ' · ' + a.last_seen : ''}</div>
          </div>
        </div>`;
      }).join('');
    } else {
      agentsRow.style.display = 'none';
    }

    // 待办
    const tasksEl = document.getElementById('tasks-list');
    const tasks = d.tasks || [];
    if (tasks.length === 0) {
      tasksEl.innerHTML = '<div class="empty-hint">暂无待办</div>';
    } else {
      tasksEl.innerHTML = tasks.map(t =>
        `<div class="task-item">
          <span class="task-dot ${t.is_today ? 'today' : ''}"></span>
          <span class="task-time">${t.time}</span>
          <span class="task-content">${t.content}</span>
        </div>`
      ).join('');
    }

    // 评价
    if (d.comment) {
      document.getElementById('comment-section').style.display = 'flex';
      document.getElementById('comment-text').textContent = d.comment;
      document.getElementById('comment-author').textContent = '— ' + (cfg.comment_author || 'Agent');
    }

    // 历史
    const histEl = document.getElementById('history-list');
    const history = d.history || [];
    if (history.length === 0) {
      histEl.innerHTML = '<div class="empty-hint">暂无动态</div>';
    } else {
      histEl.innerHTML = history.map(h =>
        `<div class="history-item">
          <span class="history-time">${h.time}</span>
          <span class="history-text">${h.text}</span>
        </div>`
      ).join('');
    }

  } catch (e) {
    console.error('Failed to load status:', e);
  }
}

loadStatus();
setInterval(loadStatus, 60000);
</script>
</body>
</html>
